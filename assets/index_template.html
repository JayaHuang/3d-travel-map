<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>山西 3D 旅行导览地图 · 表里山河</title>
<style>
  :root{
    --bg:#080b11; --panel:rgba(13,18,26,.86); --panel2:rgba(20,27,38,.9);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --txt:#e9edf5; --dim:#9aa6b8; --dim2:#6f7d92;
    --gold:#e9b950; --gold2:#ffd88a; --red:#e0644f; --cyan:#5fd3f3;
    --shadow:0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",system-ui,sans-serif;
    color:var(--txt);-webkit-font-smoothing:antialiased}
  canvas{display:block}
  #scene{position:fixed;inset:0}
  .vign{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.55) 100%)}
  .glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);box-shadow:var(--shadow)}

  /* ---------- 顶栏 ---------- */
  #top{position:fixed;top:0;left:0;right:0;height:62px;display:flex;align-items:center;
    gap:14px;padding:0 16px;z-index:30;
    background:linear-gradient(180deg,rgba(8,11,17,.92),rgba(8,11,17,0));pointer-events:none}
  #top>*{pointer-events:auto}
  .brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}
  .brand b{font-size:19px;letter-spacing:2px;
    background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand span{font-size:11px;color:var(--dim2);letter-spacing:1px}
  .brand i{font-style:normal;font-size:11px;color:var(--dim);border-left:1px solid var(--line2);padding-left:10px}
  #search{position:relative;flex:0 1 300px}
  #search input{width:100%;height:36px;border-radius:18px;border:1px solid var(--line2);
    background:rgba(255,255,255,.06);color:var(--txt);padding:0 34px 0 14px;font-size:13px;outline:none;transition:.2s}
  #search input:focus{border-color:var(--gold);background:rgba(255,255,255,.1)}
  #search input::placeholder{color:var(--dim2)}
  #search svg{position:absolute;right:11px;top:10px;opacity:.5}
  .clear-s{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;border:none;
    background:rgba(255,255,255,.14);color:var(--dim);cursor:pointer;display:none;line-height:18px;font-size:13px}
  .top-btns{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
  .tbtn{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line2);
    background:rgba(255,255,255,.05);color:var(--dim);font-size:12px;cursor:pointer;transition:.18s;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tbtn:hover{color:var(--txt);border-color:var(--gold);background:rgba(233,185,80,.12)}
  .tbtn.on{color:#12161d;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;font-weight:600}

  /* ---------- 左侧 ---------- */
  #left{position:fixed;left:14px;top:70px;bottom:96px;width:286px;z-index:25;display:flex;flex-direction:column;
    border-radius:16px;overflow:hidden}
  .sec-t{font-size:11px;color:var(--dim2);letter-spacing:2px;padding:12px 14px 8px;flex-shrink:0}
  #chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;flex-shrink:0;border-bottom:1px solid var(--line)}
  .chip{font-size:11.5px;padding:5px 10px;border-radius:12px;border:1px solid var(--line2);
    background:rgba(255,255,255,.04);color:var(--dim);cursor:pointer;transition:.16s;user-select:none}
  .chip:hover{color:var(--txt);border-color:var(--line2)}
  .chip.on{background:rgba(233,185,80,.16);border-color:var(--gold);color:var(--gold2)}
  .chip.wk.on{background:rgba(224,100,79,.18);border-color:var(--red);color:#ffb3a3}
  #routes{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
  .rchip{font-size:11.5px;padding:5px 10px;border-radius:12px;border:1px dashed rgba(95,211,243,.45);
    color:var(--cyan);cursor:pointer;transition:.16s;background:rgba(95,211,243,.06)}
  .rchip:hover{background:rgba(95,211,243,.16)}
  .rchip.on{background:var(--cyan);color:#06222c;border-style:solid;font-weight:600}
  #list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 8px 14px}
  #list::-webkit-scrollbar{width:6px}
  #list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  .city-h{display:flex;align-items:center;gap:8px;padding:9px 8px 5px;font-size:12px;color:var(--dim);
    letter-spacing:1px;cursor:pointer;user-select:none}
  .city-h .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .city-h .cnt{margin-left:auto;font-size:10px;color:var(--dim2)}
  .city-h .cv{font-size:9px;color:var(--dim2);transition:.2s}
  .city-h.closed .cv{transform:rotate(-90deg)}
  .item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:.14s;
    font-size:13px;margin:1px 0}
  .item:hover{background:rgba(255,255,255,.07)}
  .item.on{background:rgba(233,185,80,.16);box-shadow:inset 0 0 0 1px rgba(233,185,80,.4)}
  .item .s{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:var(--dim2)}
  .item .s3{background:var(--gold);box-shadow:0 0 7px var(--gold)}
  .item .s2{background:#9fb4c9}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .tg{font-size:9.5px;color:var(--red);border:1px solid rgba(224,100,79,.5);border-radius:6px;padding:1px 4px;flex-shrink:0}
  .item .tp{font-size:10px;color:var(--dim2);flex-shrink:0}
  .empty{padding:20px 10px;text-align:center;color:var(--dim2);font-size:12px}

  /* ---------- 右侧卡片 ---------- */
  #card{position:fixed;right:14px;top:70px;bottom:96px;width:352px;z-index:26;border-radius:16px;
    display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 24px));transition:transform .38s cubic-bezier(.22,1,.36,1)}
  #card.show{transform:none}
  #card .hd{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
  #card .hd h2{margin:0;font-size:20px;letter-spacing:1px}
  #card .hd .sub{margin-top:5px;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .x{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);
    background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;font-size:15px;line-height:24px;text-align:center}
  .x:hover{color:var(--txt);border-color:var(--red)}
  #card .bd{flex:1;overflow-y:auto;padding:14px 18px 20px}
  #card .bd::-webkit-scrollbar{width:6px}
  #card .bd::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .tag{font-size:10.5px;padding:3px 9px;border-radius:10px;background:rgba(233,185,80,.14);
    border:1px solid rgba(233,185,80,.35);color:var(--gold2)}
  .tag.wk{background:rgba(224,100,79,.14);border-color:rgba(224,100,79,.4);color:#ffb3a3}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .meta div{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:10px;padding:8px 9px}
  .meta .k{font-size:10px;color:var(--dim2);margin-bottom:3px;letter-spacing:.5px}
  .meta .v{font-size:12px;line-height:1.35;color:var(--txt)}
  .blk{margin-bottom:16px}
  .blk h3{margin:0 0 7px;font-size:12px;color:var(--gold);letter-spacing:1.5px;display:flex;align-items:center;gap:7px}
  .blk h3::before{content:"";width:3px;height:12px;background:var(--gold);border-radius:2px}
  .blk p{margin:0;font-size:13px;line-height:1.75;color:#cdd6e3}
  .blk ul{margin:0;padding-left:0;list-style:none}
  .blk li{font-size:12.5px;line-height:1.6;color:#c2cddc;padding:6px 0 6px 20px;position:relative;
    border-bottom:1px dashed rgba(255,255,255,.06)}
  .blk li:last-child{border-bottom:none}
  .blk li::before{content:"";position:absolute;left:4px;top:13px;width:5px;height:5px;border-radius:50%;
    background:var(--gold);opacity:.75}
  .near{display:flex;flex-wrap:wrap;gap:6px}
  .near a{font-size:11.5px;padding:5px 10px;border-radius:12px;background:rgba(95,211,243,.1);
    border:1px solid rgba(95,211,243,.3);color:var(--cyan);cursor:pointer;text-decoration:none;transition:.16s}
  .near a:hover{background:rgba(95,211,243,.22)}
  .near a i{font-style:normal;color:var(--dim2);font-size:10px;margin-left:4px}

  /* ---------- 底部 ---------- */
  #legend{position:fixed;left:14px;bottom:14px;z-index:25;border-radius:14px;padding:11px 13px;
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:520px}
  .lg{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim)}
  .lg i{width:9px;height:9px;border-radius:50%;display:block}
  .lg .bar{width:26px;height:6px;border-radius:3px;display:block}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:24;font-size:11px;
    color:var(--dim2);letter-spacing:.6px;background:rgba(8,11,17,.6);padding:7px 14px;border-radius:14px;
    border:1px solid var(--line);backdrop-filter:blur(8px);white-space:nowrap}
  #hint b{color:var(--dim);font-weight:500}
  #stat{position:fixed;right:14px;bottom:14px;z-index:24;font-size:10.5px;color:var(--dim2);text-align:right;line-height:1.7}
  #stat b{color:var(--gold);font-weight:600}

  /* ---------- tooltip ---------- */
  #tip{position:fixed;z-index:40;pointer-events:none;padding:7px 11px;border-radius:10px;font-size:12px;
    background:rgba(8,11,17,.94);border:1px solid var(--line2);box-shadow:var(--shadow);
    transform:translate(-50%,-140%);opacity:0;transition:opacity .12s;white-space:nowrap}
  #tip.show{opacity:1}
  #tip .c{color:var(--dim2);font-size:10.5px;margin-left:6px}
  #tip .t{color:var(--gold2);font-size:10.5px;display:block;margin-top:2px}

  /* ---------- loading ---------- */
  #load{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;background:var(--bg);transition:opacity .5s}
  #load.gone{opacity:0;pointer-events:none}
  #load .ring{width:44px;height:44px;border:2px solid rgba(233,185,80,.2);border-top-color:var(--gold);
    border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #load p{margin:0;font-size:12px;color:var(--dim2);letter-spacing:3px}

  @media (max-width:1180px){
    #left{width:240px}#card{width:310px}
  }
  @media (max-width:900px){
    #left{display:none}#card{left:12px;right:12px;width:auto;top:auto;height:52%;bottom:74px;
      transform:translateY(calc(100% + 20px))}
    #card.show{transform:none}
    .brand span,.brand i{display:none}
    #legend{display:none}#hint{font-size:10px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vign"></div>

<div id="top">
  <div class="brand"><b>山西 · 3D 旅行导览</b><span>TABLE MOUNTAINS &amp; RIVERS</span><i id="cntTxt">74 处景点 · 11 地市</i></div>
  <div id="search">
    <input id="q" placeholder="搜索景点 / 城市，如：云冈、平遥、太原" autocomplete="off"/>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa6b8" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <button class="clear-s" id="qc">×</button>
  </div>
  <div class="top-btns">
    <button class="tbtn" id="bTour">▶ 自动漫游</button>
    <button class="tbtn" id="bNight">☾ 夜景</button>
    <button class="tbtn" id="bReset">⟲ 复位视角</button>
  </div>
</div>

<div id="left" class="glass">
  <div class="sec-t">主题筛选</div>
  <div id="chips"></div>
  <div class="sec-t">经典线路</div>
  <div id="routes"></div>
  <div id="list"></div>
</div>

<div id="card" class="glass">
  <div class="hd">
    <button class="x" id="cx">×</button>
    <h2 id="cName"></h2>
    <div class="sub" id="cSub"></div>
  </div>
  <div class="bd" id="cBody"></div>
</div>

<div id="legend" class="glass">
  <div class="lg"><i style="background:#e9b950;box-shadow:0 0 8px #e9b950"></i>必打卡</div>
  <div class="lg"><i style="background:#9fb4c9"></i>推荐</div>
  <div class="lg"><i style="background:#5a6478"></i>小众</div>
  <div class="lg"><span class="bar" style="background:linear-gradient(90deg,#3f4a35,#8f8552,#e8e6df)"></span>海拔</div>
  <div class="lg"><span class="bar" style="background:#d9a441"></span>黄河</div>
  <div class="lg"><span class="bar" style="background:#4fb8e8"></span>汾河等水系</div>
  <div class="lg"><span class="bar" style="background:#5fd3f3"></span>推荐线路</div>
</div>

<div id="hint">
  <b>左键拖拽</b>旋转 · <b>右键/滚轮</b>平移缩放 · <b>W A S D</b> 移动 · <b>Q/E</b> 升降 · <b>R</b> 复位 · <b>点击光柱</b>看详情
</div>
<div id="stat"></div>

<div id="tip"></div>

<div id="load"><div class="ring"></div><p>正在生成表里山河…</p></div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="data/region.js"></script>
<script src="data/geo.js"></script>
<script src="data/spots.js"></script>
<script src="app.js"></script>
</body>
</html>
